# Security headers for every static response. nginx drops inherited add_header directives as soon as a
# location defines its own, so each static location includes this file explicitly.
# /api/ does NOT include it: the NestJS app sets its own headers via helmet.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HSTS only when the original request was HTTPS (value is empty -> header omitted on plain HTTP).
# $hsts_header is defined in default.conf from X-Forwarded-Proto / $scheme.
add_header Strict-Transport-Security $hsts_header always;

# CSP: everything self-hosted (Vazirmatn is bundled). Inline styles are needed by React/Radix style props.
# frame-src: the Google Maps embed on the landing/contact section. No inline scripts are allowed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
