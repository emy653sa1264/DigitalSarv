# Digital Sarv — nginx for the web container.
# Installed as /etc/nginx/conf.d/default.conf (included inside http {} of the stock nginx.conf),
# with snippets/ copied to /etc/nginx/snippets/.
#
#   /            landing          -> /index.html          (SPA fallback)
#   /app/        customer PWA     -> /app/index.html      (SPA fallback)
#   /courier/    courier PWA      -> /courier/index.html  (SPA fallback, noindex)
#   /admin/      admin panel      -> /admin/index.html    (SPA fallback, noindex)
#   /api/        reverse proxy    -> http://api:3000

# Docker's embedded DNS. The api upstream is resolved per request (variable proxy_pass), so nginx starts
# even when `api` is down or not resolvable, and follows the container's new IP after a restart.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Original scheme: trust X-Forwarded-Proto from a TLS terminator in front (Caddy, certbot'd host nginx,
# Cloudflare/ArvanCloud); fall back to our own scheme when nginx is the edge.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# HSTS only over HTTPS (an empty value makes add_header emit nothing).
map $forwarded_proto $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
           application/manifest+json application/xml application/rss+xml image/svg+xml font/ttf;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Relative Location headers (correct host/port/scheme behind any proxy)
    absolute_redirect off;
    # Static site takes no bodies; /api/ raises this for uploads.
    client_max_body_size 1m;

    # --- container healthcheck -------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API ---------------------------------------------------------------------
    location /api/ {
        # UPLOAD_MAX_MB=50 + multipart overhead
        client_max_body_size 55m;
        client_body_timeout 120s;

        set $api_upstream http://api:3000;
        # No URI part -> the original request URI (/api/...) is passed through unchanged.
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_redirect off;
    }

    # --- hashed build assets: cache forever ------------------------------------
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- PWA icons (not content-hashed) -----------------------------------------
    location ^~ /icons/ {
        try_files $uri =404;
        access_log off;
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # --- service worker & manifests: always revalidate --------------------------
    location = /sw.js {
        try_files $uri =404;
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.webmanifest$ {
        try_files $uri =404;
        types { application/manifest+json webmanifest; }
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # --- dotfiles (keep ACME http-01 reachable) ----------------------------------
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # --- customer app -------------------------------------------------------------
    location = /app { return 301 /app/$is_args$args; }
    location ^~ /app/ {
        try_files $uri /app/index.html;
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # --- courier app («سرو پیک») ---------------------------------------------------
    location = /courier { return 301 /courier/$is_args$args; }
    location ^~ /courier/ {
        try_files $uri /courier/index.html;
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # --- admin panel ----------------------------------------------------------------
    location = /admin { return 301 /admin/$is_args$args; }
    location ^~ /admin/ {
        try_files $uri /admin/index.html;
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # --- landing (and root files: favicon, robots.txt, sitemap.xml, *.html) -----
    location / {
        try_files $uri /index.html;
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
